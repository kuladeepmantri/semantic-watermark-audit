[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-watermark-audit"
version = "0.1.0"
description = "Saved-record evaluation for a semantic watermark audit"
requires-python = ">=3.10"
authors = [{name = "Kuladeep Mantri"}]
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src", "swaudit.records" = "data"}
packages = ["swaudit", "swaudit.analysis", "swaudit.headline", "swaudit.headline.part1", "swaudit.headline.part2", "swaudit.headline.part3", "swaudit.headline.part4", "swaudit.records"]

[tool.setuptools.package-data]
"swaudit.records" = ["*.json", "data/*.json", "expected/*.tex", "headline/*/*.json", "round5/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
